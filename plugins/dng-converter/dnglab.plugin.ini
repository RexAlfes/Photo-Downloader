; Photo Downloader external-program plug-in: dnglab (Windows and Linux).
; Makes a DNG copy of each downloaded raw file; the raw file is kept.
; dnglab is free and open source: https://github.com/dnglab/dnglab (download the release for your
; system; on Linux also as a .deb package). Install this file with Install... in File > Plug-ins...
; (or copy it into the Photo Downloader plugins folder). Unzip dnglab into that plugins folder (or a
; subfolder of it), or put dnglab on the PATH, or choose it with Setup...; then switch the plug-in on.

[Plugin]
Name=DNG Converter (dnglab)
Description=Makes a DNG copy of each downloaded raw file with the free dnglab converter. The raw file is kept.
Version=1.0.0
Hook=AfterFile
FileTypes=.nef;.nrw;.cr2;.cr3;.crw;.arw;.srf;.sr2;.orf;.rw2;.raf;.pef;.srw;.3fr;.iiq;.erf;.mrw;.dcr;.kdc;.rwl
Platforms=windows;linux

[Run]
Windows=dnglab.exe
Linux=dnglab
Args=convert "{file}" "{folder}{sep}{name}.dng"
Output={folder}{sep}{name}.dng
TimeoutSec=300
