; Photo Downloader external-program plug-in: Adobe DNG Converter (Windows).
; Makes a DNG copy of each downloaded raw file; the raw file is kept.
; Install the free Adobe DNG Converter from adobe.com, then install this file with Install... in
; File > Plug-ins... (or copy it into the Photo Downloader plugins folder,
; %LOCALAPPDATA%\Photo Downloader\plugins\) and switch the plug-in on there. If the converter is
; installed somewhere else, choose it with Setup...

[Plugin]
Name=DNG Converter (Adobe)
Description=Makes a DNG copy of each downloaded raw file with the free Adobe DNG Converter. The raw file is kept.
Version=1.0.0
Hook=AfterFile
FileTypes=.nef;.nrw;.cr2;.cr3;.crw;.arw;.srf;.sr2;.orf;.rw2;.raf;.pef;.srw;.3fr;.iiq;.erf;.mrw;.dcr;.kdc;.rwl;.x3f
Platforms=windows

[Run]
Windows=C:\Program Files\Adobe\Adobe DNG Converter\Adobe DNG Converter.exe
; -c: compressed (lossless) DNG; -d: folder for the DNG (the same folder as the raw file)
Args=-c -d "{folder}" "{file}"
Output={folder}{sep}{name}.dng
TimeoutSec=300
