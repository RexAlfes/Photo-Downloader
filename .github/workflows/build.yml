# Compile check for Photo Downloader.
# Builds PhotoDownloader.lpi with lazbuild on Windows and on Linux (GTK 3) for every push and pull request.
# It only compiles. It does not create releases, change files or touch the build number.
name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'GitHub/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 64-bit
            os: windows-latest
            ws: ''
          - name: Linux 64-bit (GTK 3)
            os: ubuntu-latest
            ws: '--ws=gtk3'

    steps:
      - name: Check out the source
        uses: actions/checkout@v4.2.2

      - name: Install Lazarus and Free Pascal
        uses: gcarreno/setup-lazarus@v3.3.1
        with:
          lazarus-version: stable
          with-cache: true

      - name: Install GTK 3 development files (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Compile
        shell: bash
        run: lazbuild --build-all --recursive ${{ matrix.ws }} PhotoDownloader.lpi

      - name: Show the result
        shell: bash
        run: ls -l bin/*/ || true
