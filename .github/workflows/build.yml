# Compile check for Photo Downloader.
# Builds PhotoDownloader.lpi on Windows 64-bit and on Linux 64-bit (GTK 2) with lazbuild for every push and pull request.
# It only compiles. It does not create releases, change files or touch the build number.
name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'GitHub/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 64-bit
            os: windows-latest
            ws: ''
            lpi: PhotoDownloader.lpi
          - name: Linux 64-bit (GTK 2)
            os: ubuntu-latest
            ws: '--ws=gtk2'
            lpi: PhotoDownloader.lpi

    steps:
      - name: Check out the source
        uses: actions/checkout@v4.2.2

      - name: Install Lazarus and Free Pascal
        uses: gcarreno/setup-lazarus@v3.4.1
        with:
          lazarus-version: '4.4'
          with-cache: false

      - name: Install GTK 2 development files (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk2.0-dev

      - name: Compile
        shell: bash
        run: lazbuild --build-all --recursive ${{ matrix.ws }} ${{ matrix.lpi }}

      - name: Show the result
        shell: bash
        run: ls -l bin/*/ || true
